<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>造物全过程(教学版) · Claude Code 演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Oswald:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#ece8dd;--paper:#fdfbf4;--ink:#16130f;--ink-2:#3a352e;--ink-3:#6b6457;--ink-4:#9a9384;
  --line:#dcd6c7;--line-2:#c7c0ad;--accent:#b3372a;--accent-soft:#f3e9e5;--gold:#9a7b3f;--green:#2d6a4f;
  --term:#14110d;--term-2:#1e1a15;
  --serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--cond:"Oswald",var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:radial-gradient(120% 80% at 50% 0%,rgba(255,253,247,.6),transparent 60%);}
.stage{height:100vh;display:flex;flex-direction:column;padding:12px 18px 10px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;flex-shrink:0;}
.top .brand{font-family:var(--serif);font-weight:900;font-size:18px;}
.top .brand b{color:var(--accent);}
.top .brand small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink-3);margin-left:8px;}
.top .rc{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:right;letter-spacing:.04em;}
.top .rc b{color:var(--accent);font-size:13px;}
.top .rc small{display:block;color:var(--ink-4);font-size:10px;margin-top:2px;}
.map{display:flex;gap:10px;background:var(--paper);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;margin-bottom:10px;flex-shrink:0;}
.lyr{flex:1;display:flex;align-items:center;gap:6px;}
.lyr+.lyr{border-left:1px dashed var(--line-2);padding-left:10px;}
.lyr .lname{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-4);flex-shrink:0;width:30px;line-height:1.2;}
.nodes{display:flex;gap:5px;flex:1;}
.node{flex:1;text-align:center;font-size:11px;color:var(--ink-4);border:1px solid var(--line);border-radius:5px;padding:5px 2px;background:#fff;position:relative;transition:all .3s;}
.node.done{color:var(--green);border-color:#bcd9cc;background:#f0f6f2;}
.node.done::after{content:"✓";font-size:9px;margin-left:2px;}
.node.cur{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:700;box-shadow:0 0 0 3px var(--accent-soft);}
.node.cur::after{content:"";position:absolute;inset:-1px;border-radius:5px;border:1px solid var(--accent);animation:pulse 1.3s ease-out infinite;}
@keyframes pulse{0%{opacity:.8;transform:scale(1);}100%{opacity:0;transform:scale(1.18);}}
.main{flex:1;display:grid;grid-template-columns:0.82fr 1fr;gap:14px;min-height:0;}
.term{background:var(--term);border-radius:11px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 44px -20px rgba(0,0,0,.5);border:1px solid #000;}
.term-bar{display:flex;align-items:center;gap:7px;padding:9px 13px;background:var(--term-2);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.term-bar .dot{width:10px;height:10px;border-radius:50%;}.d1{background:#ff5f57;}.d2{background:#febc2e;}.d3{background:#28c840;}
.term-bar .ttl{margin-left:7px;font-family:var(--mono);font-size:11px;color:#8a8278;}.term-bar .ttl b{color:#c9a227;}
.log{flex:1;overflow-y:auto;padding:15px 16px 20px;}
.log::-webkit-scrollbar{width:6px;}.log::-webkit-scrollbar-thumb{background:#3a342b;border-radius:4px;}
.turn{margin-bottom:14px;}
.who{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.who.you{color:#7fb8a0;}.who.ai{color:#d9a441;}
.who .av{width:15px;height:15px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;}
.who.you .av{background:#1f3d34;color:#7fb8a0;}.who.ai .av{background:#3a2e12;color:#d9a441;}
.bubble{font-family:var(--mono);font-size:12.5px;line-height:1.7;color:#e9e3d6;white-space:pre-wrap;border-left:2px solid #2f2a22;padding-left:11px;}
.turn.you .bubble{color:#f4efe3;}.turn.ai .bubble{color:#bdb6a6;border-left-color:#4a3c1a;}
.caret{display:inline-block;width:7px;height:14px;background:#7fb8a0;vertical-align:-2px;animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}
.building{display:flex;align-items:center;gap:8px;color:#d9a441;font-family:var(--mono);font-size:12px;}
.building .sp{width:12px;height:12px;border:2px solid #4a3c1a;border-top-color:#d9a441;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.done-ok{color:#7fb8a0;}.done-back{color:#e0857c;}.done-warn{color:#e0b54a;}
.ghost{font-family:var(--mono);font-size:10.5px;color:#6a6358;text-align:center;font-style:italic;border-top:1px dashed #2f2a22;border-bottom:1px dashed #2f2a22;padding:6px 4px;margin:2px 0 12px;line-height:1.4;}
.preview{display:flex;flex-direction:column;min-height:0;}
.pv-frame{flex:1;background:#fff;border-radius:11px;border:1px solid var(--line-2);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 44px -22px rgba(0,0,0,.32);position:relative;}
.pv-url{display:flex;align-items:center;gap:8px;padding:8px 13px;background:#f1efe8;border-bottom:1px solid var(--line);flex-shrink:0;}
.pv-url .b{display:flex;gap:5px;}.pv-url .b i{width:8px;height:8px;border-radius:50%;background:#d4cdbd;}
.pv-url .bar{flex:1;background:#fff;border:1px solid var(--line);border-radius:20px;font-family:var(--mono);font-size:10.5px;color:var(--ink-4);padding:4px 11px;text-align:center;}
.pv-url .bar.live{color:var(--green);border-color:#bcd9cc;background:#f0f6f2;}
.pv-body{flex:1;overflow-y:auto;position:relative;}
.pv-stage{position:absolute;inset:0;opacity:0;transition:opacity .45s;padding:20px;overflow-y:auto;}
.pv-stage.on{opacity:1;position:relative;}
.stamp{position:absolute;top:14px;right:14px;font-family:var(--cond);font-weight:700;font-size:13px;padding:4px 11px;border-radius:5px;z-index:6;transform:rotate(6deg);}
.stamp.back{color:#fff;background:var(--accent);}.stamp.warn{color:#3a2e00;background:#e0b54a;}
.judge{background:var(--ink);color:#f4efe3;border-radius:10px;padding:12px 16px;margin-top:10px;flex-shrink:0;display:flex;align-items:flex-start;gap:13px;min-height:62px;box-shadow:0 8px 26px -14px rgba(0,0,0,.5);}
.judge .jk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--gold);flex-shrink:0;border:1px solid #4a3c1a;border-radius:5px;padding:6px 9px;text-align:center;line-height:1.4;white-space:nowrap;}
.judge .jk b{display:block;font-family:var(--sans);font-size:13px;color:#e0b54a;}
.judge .jt{font-size:14px;line-height:1.6;color:#ede7da;align-self:center;}
.judge .jt b{color:#e0b54a;}.judge .jt .none{color:#8a8278;}
/* 过关验收台 */
.gate{display:grid;grid-template-columns:1.15fr .85fr;gap:0;background:var(--paper);border:1px solid var(--line-2);border-radius:10px;margin-top:10px;flex-shrink:0;overflow:hidden;box-shadow:0 6px 20px -14px rgba(0,0,0,.3);}
.gate-l{padding:11px 15px;}
.gate-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--accent);margin-bottom:7px;text-transform:uppercase;}
.rubric{list-style:none;display:flex;flex-direction:column;gap:4px;}
.rubric li{font-size:12.5px;line-height:1.4;color:var(--ink-3);}
.rubric li.ok{color:var(--green);}.rubric li.no{color:var(--accent);font-weight:500;}
.gate-r{padding:11px 15px;border-left:1px solid var(--line);background:#fbf9f3;display:flex;flex-direction:column;gap:6px;}
.judge-by{font-size:11px;color:var(--ink-3);}.judge-by b{color:var(--ink);font-size:12.5px;}
.judge-by .tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--gold);display:block;margin-bottom:2px;}
.verdict{align-self:flex-start;font-family:var(--cond);font-weight:700;font-size:16px;padding:3px 13px;border-radius:6px;}
.verdict.pass{color:#fff;background:var(--green);}.verdict.reject{color:#fff;background:var(--accent);}
.reason{font-size:11.5px;color:var(--ink-3);line-height:1.5;}
.gate-foot{grid-column:1/-1;border-top:1px dotted var(--line-2);padding:8px 15px;font-size:12px;color:var(--ink-3);font-style:italic;background:var(--bg);}
.gate-foot b{color:var(--accent);font-style:normal;}
.ctrl{display:flex;align-items:center;gap:14px;margin-top:9px;flex-shrink:0;}
.progress{flex:1;display:flex;gap:4px;}
.progress i{flex:1;height:4px;background:var(--line);border-radius:2px;transition:background .4s;}
.progress i.done{background:var(--accent);}
.steplab{font-family:var(--mono);font-size:11px;color:var(--ink-3);min-width:118px;}.steplab b{color:var(--accent);}
.changed-chip{font-size:11.5px;color:var(--ink-3);max-width:280px;}.changed-chip b{color:var(--accent);}
.next{background:var(--ink);color:#fbf8f0;border:none;border-radius:8px;padding:12px 26px;font-size:14.5px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:transform .12s,background .2s;}
.next:hover{transform:translateY(-1px);background:#000;}.next:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.replay{background:transparent;border:1px solid var(--line-2);color:var(--ink-3);border-radius:8px;padding:12px 15px;font-size:13px;cursor:pointer;}
.kbd{font-family:var(--mono);font-size:10px;color:var(--ink-4);}
.v1{font-family:Times New Roman,serif;color:#222;}
.v1 .t{font-size:18px;font-weight:bold;margin-bottom:12px;}
.v1 input,.v1 textarea{width:100%;border:1px solid #999;padding:6px;margin-bottom:9px;font-family:inherit;font-size:13px;}
.v1 button{background:#4a72d4;color:#fff;border:none;padding:6px 14px;font-size:13px;}
.v1 .out{margin-top:12px;background:#eee;border:1px solid #ccc;padding:9px;font-size:12px;color:#444;}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.tabs span{font-size:11px;border:1px solid #bbb;border-radius:5px;padding:5px 8px;background:#f3f3f3;color:#555;}
.overload .blk{border:1px dashed #c9c2b2;border-radius:6px;padding:8px;margin-bottom:7px;font-size:11.5px;color:#888;background:#faf8f2;}
.bk .kk{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase;}
.bk .h{font-family:var(--serif);font-weight:900;font-size:21px;margin:7px 0 4px;}
.bk .sub{font-size:12px;color:var(--ink-3);line-height:1.6;margin-bottom:13px;}
.bk .lab{font-size:11.5px;color:var(--ink-2);margin:0 0 5px;font-weight:500;}
.bk .in{border:1px solid var(--line-2);border-radius:7px;padding:9px 11px;background:#fff;font-size:12.5px;color:var(--ink-3);margin-bottom:10px;}
.bk .btn{background:var(--ink);color:#fbf8f0;border-radius:7px;padding:10px;text-align:center;font-size:13px;font-weight:500;}
.tag-soft{display:inline-block;font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 7px;margin-bottom:8px;font-family:var(--mono);}
.rcard{border:1px solid var(--line-2);border-radius:9px;overflow:hidden;margin-top:12px;background:var(--paper);}
.rcard .rh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.ring{width:50px;height:50px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:17px;color:#fff;}
.ring i{font-style:normal;font-size:9px;opacity:.85;}
.rh .vt{font-family:var(--serif);font-weight:700;font-size:15px;}.rh .vs{font-size:11px;color:var(--ink-3);margin-top:2px;}
.dim{padding:8px 14px;border-bottom:1px dotted var(--line-2);}
.dim .dr{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}.dim .dr b{font-family:var(--cond);}
.dim .tk{height:5px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden;}.dim .fl{height:100%;border-radius:3px;}
.fixrow{display:flex;gap:8px;padding:8px 14px;font-size:12px;line-height:1.55;color:var(--ink-2);}
.fixrow .n{font-family:var(--cond);font-weight:700;color:#fff;background:var(--accent);width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;}
.fixrow b{color:var(--ink);}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 10px;}
.chip{font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-3);}
.chip.ok{color:var(--green);border-color:#bcd9cc;background:#f0f6f2;}.chip.no{color:var(--accent);border-color:#e6c5bf;background:var(--accent-soft);}
.err{font-family:var(--mono);background:#2a1512;border:1px solid #5a2a24;border-radius:8px;padding:14px;color:#ffb4ab;font-size:12px;line-height:1.7;}
.err .ttl{color:#ff6b5e;font-weight:700;margin-bottom:8px;}
.notes{margin-top:2px;}
.note-sticky{background:#fff6d6;border:1px solid #e6d48a;border-radius:6px;padding:9px 11px;font-size:12px;color:#5a4a16;margin-bottom:7px;box-shadow:0 2px 6px -3px rgba(0,0,0,.2);}
.note-sticky b{color:#8a6d12;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl td{padding:7px 6px;border-bottom:1px dotted var(--line-2);}
.tbl tr.hd td{color:var(--ink-4);font-size:10.5px;border-bottom:1px solid var(--line);}
.tbl .sc{text-align:right;font-family:var(--cond);color:var(--accent);}
.stat-cards{display:flex;gap:10px;margin-bottom:12px;}
.stat-cards .sc{flex:1;background:var(--paper);border:1px solid var(--line-2);border-radius:8px;padding:11px;text-align:center;}
.stat-cards .sc .n{font-family:var(--cond);font-weight:700;font-size:21px;color:var(--accent);}
.stat-cards .sc .l{font-size:10px;color:var(--ink-4);}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
.bar-row .bl{width:84px;flex-shrink:0;color:var(--ink-2);}
.bar-row .bt{flex:1;height:9px;background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden;}
.bar-row .bf{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));}
.bar-row .bp{width:34px;text-align:right;font-family:var(--cond);color:var(--accent);}
.resume .doc{background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:16px;box-shadow:0 4px 12px -7px rgba(0,0,0,.2);}
.resume .nm{font-family:var(--serif);font-weight:700;font-size:15px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:9px;}
.resume .sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-4);margin:9px 0 6px;}
.resume .line{height:7px;background:#eee;border-radius:3px;margin-bottom:6px;}.resume .line.s{width:58%;}
.resume .bullet{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:10px 12px;font-size:12px;line-height:1.65;color:var(--ink);margin:7px 0;}.resume .bullet b{color:var(--accent);}
.qrow{display:flex;gap:8px;font-size:12px;line-height:1.5;color:var(--ink-2);padding:7px 0;border-bottom:1px dotted var(--line-2);}
.qrow .qn{font-family:var(--cond);font-weight:700;color:var(--accent);flex-shrink:0;}
.endcard{text-align:center;padding:22px 16px;}
.endcard .big{font-family:var(--serif);font-weight:900;font-size:21px;line-height:1.4;margin-bottom:12px;}
.endcard .big em{color:var(--accent);font-style:normal;}
.endcard .row{display:flex;justify-content:center;gap:20px;margin:16px 0;}
.endcard .row .n{font-family:var(--cond);font-weight:700;font-size:25px;color:var(--accent);}
.endcard .row .l{font-size:10px;color:var(--ink-4);font-family:var(--mono);margin-top:2px;}
.endcard .note{font-size:12.5px;color:var(--ink-3);line-height:1.8;max-width:420px;margin:0 auto;}
.endcard .note b{color:var(--ink);}
@media(max-width:900px){body{overflow:auto;}.stage{height:auto;}.main{grid-template-columns:1fr;grid-template-rows:340px 340px;}.map{flex-wrap:wrap;}}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <div class="brand">造物全过程 · 教学版<small>一个零代码的人,怎么用判断驾驭 AI 把作品做出来</small></div>
    <div class="rc"><span id="rclab">第一层已完成 · 准备进入「造物」</span><small id="rcsub">真实从想法到上线常要 40+ 轮反复 · 这里浓缩成关键节点</small></div>
  </div>
  <div class="map" id="map"></div>
  <div class="main">
    <div class="term">
      <div class="term-bar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="ttl">claude code — <b>~/标题诊断器</b></span></div>
      <div class="log" id="log"></div>
    </div>
    <div class="preview">
      <div class="pv-frame">
        <div class="pv-url"><span class="b"><i></i><i></i><i></i></span><span class="bar" id="urlbar">本地预览 · 还没动手</span></div>
        <div class="pv-body" id="pvbody"></div>
      </div>
    </div>
  </div>
  <div class="gate" id="gate"><div class="gate-foot">点「下一步」——你会看到:<b>每一步都有一个不含糊的验收标准 + 一个专业的人或真实用户判你过没过。</b>这,才是一个人 + AI 给不了的。</div></div>
  <div class="ctrl">
    <span class="steplab">第 <b id="cur">0</b> / <span id="tot">14</span> 节点</span>
    <span class="progress" id="prog"></span>
    <span class="changed-chip" id="chip"></span>
    <span class="kbd">空格/→</span>
    <button class="replay" onclick="resetAll()">↻ 重来</button>
    <button class="next" id="nextBtn" onclick="nextStep()">▶ 开始</button>
  </div>
</div>
<script>
const NODES=[['翻牌','雷达','选种','踩点'],['造物','验真','磨刃','上线'],['立面','翻译','嵌入','作品竞选']];
const LN=['翻出牌','做成牌','打出去'];
const DONE_AT_START=['翻牌','雷达','选种','踩点'];
let visited=new Set(DONE_AT_START), curNode=null;
function renderMap(){document.getElementById('map').innerHTML=NODES.map((grp,gi)=>{
  const ns=grp.map(n=>{let c='node';if(n===curNode)c+=' cur';else if(visited.has(n))c+=' done';return `<span class="${c}">${n}</span>`;}).join('');
  return `<div class="lyr"><span class="lname">${LN[gi]}</span><div class="nodes">${ns}</div></div>`;}).join('');}
function setNode(n){if(curNode&&curNode!==n)visited.add(curNode);curNode=n;renderMap();}

const STEPS=[
{node:'造物',round:'造物前 · 先调研',skip:0,
 prompt:`先别急着写代码,帮我调研清楚再动手:
1)“标题/开头没人点”这个痛点真存在吗?哪些人、在哪最常抱怨?
2)市面同类工具怎么做的、缺什么?
3)给我 5 条目标用户的真实吐槽原话。`,
 build:'正在检索 + 汇总调研…',status:'ok',done:'✓ 调研摘要已生成',
 judge:`不调研就开做 = 自我感动。<b>先确认痛点真不真、竞品缺什么</b>——这步省了,做出来可能是没人要的东西。`,
 chip:'先调研,再动手',url:'research.md · 调研笔记',view:'research'},

{node:'造物',round:'造物 · 第 1 轮',skip:0,
 prompt:`你是资深内容运营,擅长用 AI 做轻量产品。

const ENDVIEW=`<div class="endcard"><div class="big">这只是 12 步里的<em>第二层</em><br>你看到的,是<em>判断</em>,不是魔法</div>
  <div class="row"><div><div class="n">40+</div><div class="l">轮反复</div></div><div><div class="n">3</div><div class="l">次打回/报错/被否</div></div><div><div class="n">6</div><div class="l">/12 步</div></div></div>
  <div class="note">光这一段就含:<b>调研、评分模型设计、几十轮调试、陌生人验证、接后端数据、上线、翻简历</b>——没一步是“一句话搞定”。<br><br>翻牌、雷达、选种、踩点、立面、作品竞选,今晚还没走。<br>难的从来不是 AI,是<b>每一步:砍什么、听谁、改哪句、怎么讲</b>。这些判断,只能在被一次次打回里长出来。</div></div>`;

/* 每步的「过关验收」:不含糊的标准(带阈值)+ 谁来判 + 通过/打回 */
const GATES=[
{by:'专业导师',byTag:'方向 / 调研评审',verdict:'pass',rubric:[[1,'痛点有 ≥3 个公开求助实例'],[1,'竞品 ≥3 个,且能说出各自缺口'],[1,'≥5 条目标用户原话'],],reason:'标准达到 → 放行,可以动手。'},
{by:'专业导师',byTag:'第一版功能关',verdict:'pass',rubric:[[1,'能运行、不报错'],[1,'确实只有 1 个核心功能'],[1,'用户操作 ≤ 3 步'],],reason:'第一版达标(丑没关系,先过功能关)。'},
{by:'专业导师',byTag:'聚焦关',verdict:'reject',rubric:[[0,'功能数 = 1(多一个就打回)'],[0,'没有多余入口'],],reason:'它擅自加到 5 个功能 → 打回重砍。新手最爱在这糊弄自己。'},
{by:'专业导师',byTag:'诊断质量关',verdict:'pass',rubric:[[1,'每条建议含「具体改什么 + 为什么」'],[1,'建议 ≤ 3 条'],[1,'没有"正确废话"'],],reason:'诊断可执行 → 过。'},
{by:'资深内容运营导师',byTag:'评分模型关',verdict:'pass',rubric:[[1,'每个维度的打分规则能一句话解释'],[1,'没有"综合评估"这类黑箱词'],[1,'能讲给面试官听'],],reason:'模型可解释 → 过。这是有没有深度的分水岭。'},
{by:'专业导师',byTag:'调试关',verdict:'pass',rubric:[[1,'报错清零'],[1,'改动只限报错处,未波及其他'],],reason:'定位准、改动小 → 过。'},
{by:'专业导师',byTag:'呈现关',verdict:'pass',rubric:[[1,'3 秒看懂分数与结论'],[1,'检测到的信号可见'],],reason:'信息层级清楚 → 过。'},
{by:'专业导师',byTag:'移动端 / 质感关',verdict:'pass',rubric:[[1,'375px 宽不横向滚动'],[1,'无默认蓝/紫渐变模板感'],[1,'首屏一句话说清用途'],],reason:'移动端与质感达标 → 过。'},
{by:'10 位真实陌生用户',byTag:'市场验真关',verdict:'reject',rubric:[[0,'≥8 人 3 秒看懂用途(实测仅 3 人)'],[0,'≥6 人愿意再用'],[0,'能说出一句话价值'],],reason:'真实用户没看懂、说不清价值 → 打回。朋友夸十句,不如这一盆冷水。'},
{by:'真实用户复测',byTag:'磨刃关',verdict:'pass',rubric:[[1,'复测 ≥8 人 3 秒看懂'],[1,'改动只针对真实卡点,不是自己想加'],],reason:'复测达标 → 过。'},
{by:'专业导师',byTag:'数据深度关',verdict:'pass',rubric:[[1,'有真实样本量(不是编的数)'],[1,'统计口径可追溯'],],reason:'数据可信 → 过。面试能讲"62% 栽在情绪钩子"。'},
{by:'专业导师抽查',byTag:'上线关',verdict:'pass',rubric:[[1,'陌生设备能打开'],[1,'手机能打开'],[1,'链接可分享'],],reason:'可公开访问 → 过。'},
{by:'资深 HR',byTag:'简历关',verdict:'pass',rubric:[[1,'HR 10 秒说出"证明什么岗位能力"'],[1,'含量化结果'],[1,'含可点开链接'],],reason:'(初稿被 HR 打回过一次:看不出岗位能力。这是改后 → 过。)'},
{by:'导师模拟面 + AI 压测',byTag:'面试关',verdict:'pass',rubric:[[1,'8 问能稳答 ≥6 个'],[1,'3 个弱点都有具体改法'],],reason:'扛得住追问 → 过。'},
];
function renderGate(idx){const g=GATES[idx],s=STEPS[idx];
  const rub=g.rubric.map(r=>`<li class="${r[0]?'ok':'no'}">${r[0]?'✓':'✗'} ${r[1]}</li>`).join('');
  const vc=g.verdict==='pass'?'pass':'reject',vt=g.verdict==='pass'?'✅ 通过':'❌ 打回';
  document.getElementById('gate').innerHTML=
   `<div class="gate-l"><div class="gate-h">这一步的验收标准 · 不含糊(skill 级)</div><ul class="rubric">${rub}</ul></div>`+
   `<div class="gate-r"><div class="judge-by"><span class="tag">${g.byTag}</span>判官 · <b>${g.by}</b></div><div class="verdict ${vc}">${vt}</div><div class="reason">${g.reason}</div></div>`+
   `<div class="gate-foot">🧠 ${s.judge}</div>`;
}

let i=-1,busy=false;
const log=document.getElementById('log'),pvbody=document.getElementById('pvbody'),prog=document.getElementById('prog');
function buildProg(){prog.innerHTML='';STEPS.forEach(()=>prog.appendChild(document.createElement('i')));}
document.getElementById('tot').textContent=STEPS.length;
function addGhost(n){const g=document.createElement('div');g.className='ghost';g.textContent='⋯ 此处省略 '+n+' 轮细节调整(改字号 · 调措辞 · 修边界 · 兼容浏览器 …) ⋯';log.appendChild(g);log.scrollTop=log.scrollHeight;}
function addTurn(cls,who,av){const t=document.createElement('div');t.className='turn '+cls;t.innerHTML=`<div class="who ${cls}"><span class="av">${av}</span>${who}</div><div class="bubble"></div>`;log.appendChild(t);log.scrollTop=log.scrollHeight;return t.querySelector('.bubble');}
function typewrite(el,text,cb){let n=0;const car=document.createElement('span');car.className='caret';el.appendChild(car);const sp=Math.max(7,Math.min(20,1000/text.length));
  const t=setInterval(()=>{n++;el.textContent=text.slice(0,n);el.appendChild(car);log.scrollTop=log.scrollHeight;if(n>=text.length){clearInterval(t);car.remove();cb&&cb();}},sp);}
function showView(key){pvbody.innerHTML=`<div class="pv-stage on">${key==='end'?ENDVIEW:VIEWS[key]}</div>`;}
function stamp(type){if(type==='ok')return'';return `<span class="stamp ${type}">${type==='back'?'打回':'报错'}</span>`;}
function nextStep(){
  if(busy)return;
  if(i>=STEPS.length-1){endShow();return;}
  busy=true;i++;
  const s=STEPS[i];
  document.getElementById('cur').textContent=i+1;
  document.getElementById('rclab').textContent=s.round;
  document.getElementById('nextBtn').disabled=true;
  setNode(s.node);
  if(s.skip)addGhost(s.skip);
  const youB=addTurn('you','你','▶');
  typewrite(youB,s.prompt,()=>{
    const aiB=addTurn('ai','Claude Code','✦');
    aiB.innerHTML=`<span class="building"><span class="sp"></span>${s.build}</span>`;log.scrollTop=log.scrollHeight;
    setTimeout(()=>{
      document.getElementById('urlbar').textContent=s.url;
      document.getElementById('urlbar').classList.toggle('live',s.view==='live');
      showView(s.view);
      const vr=GATES[i].verdict, stype=vr==='reject'?'back':(s.status==='warn'?'warn':'ok');
      const st=stamp(stype);if(st)pvbody.querySelector('.pv-stage').insertAdjacentHTML('beforeend',st);
      const cls=vr==='reject'?'done-back':(s.status==='warn'?'done-warn':'done-ok');
      aiB.innerHTML=`<span class="${cls}">${s.done}</span>`;log.scrollTop=log.scrollHeight;
      renderGate(i);
      document.getElementById('chip').innerHTML='✨ '+s.chip;
      prog.children[i].classList.add('done');
      document.getElementById('nextBtn').disabled=false;
      document.getElementById('nextBtn').textContent=(i>=STEPS.length-1)?'▶ 看总结':'▶ 下一步';
      busy=false;
    },1200);
  });
}
function endShow(){busy=true;showView('end');visited=new Set(['翻牌','雷达','选种','踩点','造物','验真','磨刃','上线','翻译','嵌入']);curNode=null;renderMap();
  document.getElementById('urlbar').textContent='造物全过程 · 完成';document.getElementById('rclab').textContent='本场演示结束';
  document.getElementById('gate').innerHTML='<div class="gate-foot">你看到了吗——<b>每一步都卡在一个不含糊的验收标准上,而判你过没过的,是专业导师或真实用户,不是 AI、更不是你自己。</b>提示词谁都抄得到;但"每一步的判断标准 + 那个卡你的人",才是 12 道关真正卖的东西。</div>';
  document.getElementById('nextBtn').textContent='✓ 完成';document.getElementById('nextBtn').disabled=true;busy=false;}
function resetAll(){i=-1;busy=false;log.innerHTML='';visited=new Set(DONE_AT_START);curNode=null;renderMap();buildProg();
  document.getElementById('cur').textContent='0';document.getElementById('rclab').textContent='第一层已完成 · 准备进入「造物」';
  document.getElementById('urlbar').textContent='本地预览 · 还没动手';document.getElementById('urlbar').classList.remove('live');
  document.getElementById('chip').innerHTML='';document.getElementById('gate').innerHTML='<div class="gate-foot">点「下一步」——每一步都有:<b>不含糊的验收标准(skill 级)+ 专业的人 / 真实用户的判定</b>。这是一个人 + AI 给不了的。</div>';
  document.getElementById('nextBtn').disabled=false;document.getElementById('nextBtn').textContent='▶ 开始';
  pvbody.innerHTML=`<div class="pv-stage on" style="display:flex;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--ink-4)"><div><div style="font-family:var(--serif);font-size:17px;color:var(--ink-3);margin-bottom:8px">第一场你已翻出牌(第一层 ✓)</div><div style="font-size:13px">今晚演第二层「造物」——看一个零代码的人,怎么一轮轮把它逼出来 →</div></div></div>`;
}
resetAll();
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();nextStep();}});
</script>
</body>
</html>
