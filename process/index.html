<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工作流引擎 · Claude Code 造物演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Oswald:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#ece8dd;--paper:#fdfbf4;--ink:#16130f;--ink-2:#3a352e;--ink-3:#6b6457;--ink-4:#9a9384;
  --line:#dcd6c7;--line-2:#c7c0ad;--accent:#b3372a;--accent-soft:#f3e9e5;--gold:#9a7b3f;--green:#2d6a4f;
  --term:#14110d;--term-2:#1e1a15;
  --serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--cond:"Oswald",var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:radial-gradient(120% 80% at 50% 0%,rgba(255,253,247,.6),transparent 60%);}
.stage{height:100vh;display:flex;flex-direction:column;padding:11px 16px 9px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-shrink:0;}
.top .brand{font-family:var(--serif);font-weight:900;font-size:17px;}
.top .brand b{color:var(--accent);}
.top .brand small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--accent);margin-left:8px;}
.top .rc{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;}
.top .rc b{color:var(--accent);font-size:14px;}.top .rc small{display:block;color:var(--ink-4);font-size:9.5px;margin-top:1px;}
/* 工作流循环(hero) */
.wf{display:flex;align-items:center;gap:6px;background:var(--ink);border-radius:10px;padding:9px 12px;margin-bottom:8px;flex-shrink:0;box-shadow:0 8px 24px -14px rgba(0,0,0,.5);}
.wf .wl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--gold);flex-shrink:0;margin-right:4px;}
.wstage{flex:1;text-align:center;font-size:12px;color:#8a8278;background:#241f19;border:1px solid #2f2a22;border-radius:6px;padding:7px 4px;transition:all .25s;position:relative;}
.wstage.active{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:700;transform:translateY(-1px);box-shadow:0 4px 12px -4px rgba(179,55,42,.6);}
.wstage.active.pass{background:var(--green);border-color:var(--green);box-shadow:0 4px 12px -4px rgba(45,106,79,.6);}
.wstage.active.reject{background:var(--accent);}
.wstage.done{color:#c9c0b0;border-color:#3a342b;}
.warr{color:#4a443a;font-size:13px;flex-shrink:0;}
.warr.loop{color:var(--gold);}
/* 主区 */
.main{flex:1;display:grid;grid-template-columns:0.86fr 1fr;gap:13px;min-height:0;}
.term{background:var(--term);border-radius:11px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 40px -20px rgba(0,0,0,.5);border:1px solid #000;}
.term-bar{display:flex;align-items:center;gap:7px;padding:8px 12px;background:var(--term-2);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.term-bar .dot{width:9px;height:9px;border-radius:50%;}.d1{background:#ff5f57;}.d2{background:#febc2e;}.d3{background:#28c840;}
.term-bar .ttl{margin-left:6px;font-family:var(--mono);font-size:10.5px;color:#8a8278;}.term-bar .ttl b{color:#c9a227;}
.log{flex:1;overflow-y:auto;padding:13px 15px 18px;}
.log::-webkit-scrollbar{width:6px;}.log::-webkit-scrollbar-thumb{background:#3a342b;border-radius:4px;}
.turn{margin-bottom:13px;}
.who{font-family:var(--mono);font-size:10px;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.who.you{color:#7fb8a0;}.who.ai{color:#d9a441;}
.who .av{width:15px;height:15px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;}
.who.you .av{background:#1f3d34;color:#7fb8a0;}.who.ai .av{background:#3a2e12;color:#d9a441;}
.bubble{font-family:var(--mono);font-size:12px;line-height:1.7;color:#e9e3d6;white-space:pre-wrap;border-left:2px solid #2f2a22;padding-left:11px;}
.turn.you .bubble{color:#f4efe3;}.turn.ai .bubble{color:#bdb6a6;border-left-color:#4a3c1a;}
.caret{display:inline-block;width:7px;height:13px;background:#7fb8a0;vertical-align:-2px;animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:0;}}
.building{display:flex;align-items:center;gap:8px;color:#d9a441;font-family:var(--mono);font-size:11.5px;}
.building .sp{width:12px;height:12px;border:2px solid #4a3c1a;border-top-color:#d9a441;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.done-ok{color:#7fb8a0;}.done-back{color:#e0857c;}.done-warn{color:#e0b54a;}
.ghost{font-family:var(--mono);font-size:10px;color:#6a6358;text-align:center;font-style:italic;border-top:1px dashed #2f2a22;border-bottom:1px dashed #2f2a22;padding:5px 4px;margin:2px 0 11px;}
.preview{display:flex;flex-direction:column;min-height:0;}
.pv-frame{flex:1;background:#fff;border-radius:11px;border:1px solid var(--line-2);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 40px -22px rgba(0,0,0,.32);position:relative;}
.pv-url{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#f1efe8;border-bottom:1px solid var(--line);flex-shrink:0;}
.pv-url .b{display:flex;gap:5px;}.pv-url .b i{width:8px;height:8px;border-radius:50%;background:#d4cdbd;}
.pv-url .bar{flex:1;background:#fff;border:1px solid var(--line);border-radius:20px;font-family:var(--mono);font-size:10px;color:var(--ink-4);padding:4px 10px;text-align:center;}
.pv-url .bar.live{color:var(--green);border-color:#bcd9cc;background:#f0f6f2;}
.pv-body{flex:1;overflow-y:auto;position:relative;}
.pv-stage{position:absolute;inset:0;opacity:0;transition:opacity .45s;padding:18px;overflow-y:auto;}
.pv-stage.on{opacity:1;position:relative;}
.stamp{position:absolute;top:13px;right:13px;font-family:var(--cond);font-weight:700;font-size:13px;padding:4px 11px;border-radius:5px;z-index:6;transform:rotate(6deg);}
.stamp.back{color:#fff;background:var(--accent);}.stamp.warn{color:#3a2e00;background:#e0b54a;}
/* 多维验证台 */
.verify{display:grid;grid-template-columns:1.2fr .8fr;background:var(--paper);border:1px solid var(--line-2);border-radius:10px;margin-top:9px;flex-shrink:0;overflow:hidden;box-shadow:0 6px 20px -14px rgba(0,0,0,.3);}
.vf-l{padding:9px 14px;}
.vf-h{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--accent);margin-bottom:6px;text-transform:uppercase;}
.dims{list-style:none;display:flex;flex-direction:column;gap:3px;}
.dim-row{display:flex;align-items:center;gap:8px;font-size:12px;transition:all .2s;opacity:.35;}
.dim-row.shown{opacity:1;}
.dim-row .dchk{width:16px;flex-shrink:0;text-align:center;font-weight:700;color:var(--ink-4);}
.dim-row.ok .dchk{color:var(--green);}.dim-row.no .dchk{color:var(--accent);}
.dim-row .dtxt{flex:1;color:var(--ink-2);}.dim-row.no .dtxt{color:var(--accent);font-weight:500;}
.dim-row .dby{font-family:var(--mono);font-size:9px;color:var(--ink-4);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;flex-shrink:0;}
.dim-row.ok .dby{color:var(--green);border-color:#bcd9cc;}.dim-row.no .dby{color:var(--accent);border-color:#e6c5bf;}
.vf-r{padding:9px 14px;border-left:1px solid var(--line);background:#fbf9f3;display:flex;flex-direction:column;gap:5px;justify-content:center;}
.verdict{align-self:flex-start;font-family:var(--cond);font-weight:700;font-size:16px;padding:3px 13px;border-radius:6px;transition:all .3s;}
.verdict.wait{color:var(--ink-4);background:var(--bg);font-size:12px;font-family:var(--sans);}
.verdict.pass{color:#fff;background:var(--green);}.verdict.reject{color:#fff;background:var(--accent);}
.vreason{font-size:11px;color:var(--ink-3);line-height:1.5;}
.vf-foot{grid-column:1/-1;border-top:1px dotted var(--line-2);padding:7px 14px;font-size:11.5px;color:var(--ink-3);font-style:italic;background:var(--bg);}
.vf-foot b{color:var(--accent);font-style:normal;}
.ctrl{display:flex;align-items:center;gap:13px;margin-top:8px;flex-shrink:0;}
.progress{flex:1;display:flex;gap:4px;}
.progress i{flex:1;height:4px;background:var(--line);border-radius:2px;transition:background .4s;}.progress i.done{background:var(--accent);}
.steplab{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:96px;}.steplab b{color:var(--accent);}
.next{background:var(--ink);color:#fbf8f0;border:none;border-radius:8px;padding:11px 24px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--sans);transition:transform .12s,background .2s;}
.next:hover{transform:translateY(-1px);background:#000;}.next:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.replay{background:transparent;border:1px solid var(--line-2);color:var(--ink-3);border-radius:8px;padding:11px 14px;font-size:12.5px;cursor:pointer;}
.kbd{font-family:var(--mono);font-size:10px;color:var(--ink-4);}
/* mockups */
.v1{font-family:Times New Roman,serif;color:#222;}.v1 .t{font-size:17px;font-weight:bold;margin-bottom:11px;}
.v1 input,.v1 textarea{width:100%;border:1px solid #999;padding:6px;margin-bottom:8px;font-family:inherit;font-size:13px;}
.v1 button{background:#4a72d4;color:#fff;border:none;padding:6px 14px;font-size:13px;}
.v1 .out{margin-top:11px;background:#eee;border:1px solid #ccc;padding:9px;font-size:12px;color:#444;}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;}.tabs span{font-size:11px;border:1px solid #bbb;border-radius:5px;padding:5px 8px;background:#f3f3f3;color:#555;}
.overload .blk{border:1px dashed #c9c2b2;border-radius:6px;padding:8px;margin-bottom:6px;font-size:11.5px;color:#888;background:#faf8f2;}
.bk .kk{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase;}
.bk .h{font-family:var(--serif);font-weight:900;font-size:20px;margin:6px 0 4px;}
.bk .sub{font-size:12px;color:var(--ink-3);line-height:1.6;margin-bottom:12px;}
.bk .lab{font-size:11.5px;color:var(--ink-2);margin:0 0 5px;font-weight:500;}
.bk .in{border:1px solid var(--line-2);border-radius:7px;padding:9px 11px;background:#fff;font-size:12.5px;color:var(--ink-3);margin-bottom:10px;}
.bk .btn{background:var(--ink);color:#fbf8f0;border-radius:7px;padding:10px;text-align:center;font-size:13px;font-weight:500;}
.tag-soft{display:inline-block;font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 7px;margin-bottom:8px;font-family:var(--mono);}
.rcard{border:1px solid var(--line-2);border-radius:9px;overflow:hidden;margin-top:11px;background:var(--paper);}
.rcard .rh{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;}
.ring{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:16px;color:#fff;}
.ring i{font-style:normal;font-size:9px;opacity:.85;}
.rh .vt{font-family:var(--serif);font-weight:700;font-size:14px;}.rh .vs{font-size:11px;color:var(--ink-3);margin-top:2px;}
.dim2{padding:7px 13px;border-bottom:1px dotted var(--line-2);}
.dim2 .dr{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}.dim2 .dr b{font-family:var(--cond);}
.dim2 .tk{height:5px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden;}.dim2 .fl{height:100%;border-radius:3px;}
.fixrow{display:flex;gap:8px;padding:7px 13px;font-size:11.5px;line-height:1.5;color:var(--ink-2);}
.fixrow .n{font-family:var(--cond);font-weight:700;color:#fff;background:var(--accent);width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;}
.fixrow b{color:var(--ink);}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 13px 9px;}
.chip{font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-3);}
.chip.ok{color:var(--green);border-color:#bcd9cc;background:#f0f6f2;}.chip.no{color:var(--accent);border-color:#e6c5bf;background:var(--accent-soft);}
.err{font-family:var(--mono);background:#2a1512;border:1px solid #5a2a24;border-radius:8px;padding:13px;color:#ffb4ab;font-size:11.5px;line-height:1.7;}
.err .ttl{color:#ff6b5e;font-weight:700;margin-bottom:7px;}
.note-sticky{background:#fff6d6;border:1px solid #e6d48a;border-radius:6px;padding:8px 10px;font-size:11.5px;color:#5a4a16;margin-bottom:6px;}.note-sticky b{color:#8a6d12;}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px;}.tbl td{padding:6px;border-bottom:1px dotted var(--line-2);}.tbl tr.hd td{color:var(--ink-4);font-size:10px;border-bottom:1px solid var(--line);}.tbl .sc{text-align:right;font-family:var(--cond);color:var(--accent);}
.stat-cards{display:flex;gap:9px;margin-bottom:11px;}.stat-cards .s{flex:1;background:var(--paper);border:1px solid var(--line-2);border-radius:8px;padding:10px;text-align:center;}.stat-cards .s .n{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--accent);}.stat-cards .s .l{font-size:10px;color:var(--ink-4);}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px;}.bar-row .bl{width:80px;flex-shrink:0;color:var(--ink-2);}.bar-row .bt{flex:1;height:8px;background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden;}.bar-row .bf{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));}.bar-row .bp{width:32px;text-align:right;font-family:var(--cond);color:var(--accent);}
.resume .doc{background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:15px;box-shadow:0 4px 12px -7px rgba(0,0,0,.2);}
.resume .nm{font-family:var(--serif);font-weight:700;font-size:14px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:9px;}
.resume .sec{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-4);margin:8px 0 6px;}
.resume .line{height:7px;background:#eee;border-radius:3px;margin-bottom:6px;}.resume .line.s{width:58%;}
.resume .bullet{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:9px 11px;font-size:11.5px;line-height:1.6;color:var(--ink);margin:7px 0;}.resume .bullet b{color:var(--accent);}
.qrow{display:flex;gap:8px;font-size:11.5px;line-height:1.5;color:var(--ink-2);padding:6px 0;border-bottom:1px dotted var(--line-2);}.qrow .qn{font-family:var(--cond);font-weight:700;color:var(--accent);flex-shrink:0;}
.endcard{text-align:center;padding:20px 14px;}
.endcard .big{font-family:var(--serif);font-weight:900;font-size:20px;line-height:1.4;margin-bottom:11px;}.endcard .big em{color:var(--accent);font-style:normal;}
.endcard .row{display:flex;justify-content:center;gap:18px;margin:14px 0;}.endcard .row .n{font-family:var(--cond);font-weight:700;font-size:24px;color:var(--accent);}.endcard .row .l{font-size:10px;color:var(--ink-4);font-family:var(--mono);margin-top:2px;}
.endcard .note{font-size:12px;color:var(--ink-3);line-height:1.8;max-width:430px;margin:0 auto;}.endcard .note b{color:var(--ink);}
@media(max-width:900px){body{overflow:auto;}.stage{height:auto;}.main{grid-template-columns:1fr;grid-template-rows:320px 320px;}.wf{flex-wrap:wrap;}}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <div class="brand">造物工作流引擎<small>重要的不是提示词,是这套工作流</small></div>
    <div class="rc"><span>工作流 · 第 <b id="rnd">0</b> 轮</span><small id="rcsub">每条要求都要被逐维验证 + 真人判过,才算有效</small></div>
  </div>
  <div class="wf" id="wf">
    <span class="wl">工作流<br>循环</span>
    <span class="wstage" data-s="0">① 写 Brief</span><span class="warr">→</span>
    <span class="wstage" data-s="1">② AI 造</span><span class="warr">→</span>
    <span class="wstage" data-s="2">③ 多维验证</span><span class="warr">→</span>
    <span class="wstage" data-s="3">④ 真人判定</span><span class="warr">→</span>
    <span class="wstage" data-s="4">⑤ 过 / 打回</span><span class="warr loop">↺</span>
  </div>
  <div class="main">
    <div class="term">
      <div class="term-bar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="ttl">claude code — <b>~/标题诊断器</b></span></div>
      <div class="log" id="log"></div>
    </div>
    <div class="preview">
      <div class="pv-frame">
        <div class="pv-url"><span class="b"><i></i><i></i><i></i></span><span class="bar" id="urlbar">本地预览 · 还没动手</span></div>
        <div class="pv-body" id="pvbody"></div>
      </div>
    </div>
  </div>
  <div class="verify" id="verify"><div class="vf-foot" id="vfoot0">点「下一步」——看每个提示词里的<b>每一条要求,怎么被逐维验证、被真人判过</b>。提示词谁都会写,这套工作流才是壁垒。</div></div>
  <div class="ctrl">
    <span class="steplab">第 <b id="cur">0</b> / <span id="tot">13</span> 关</span>
    <span class="progress" id="prog"></span>
    <span class="kbd">空格/→</span>
    <button class="replay" onclick="resetAll()">↻ 重来</button>
    <button class="next" id="nextBtn" onclick="nextStep()">▶ 开始</button>
  </div>
</div>
<script>
const STEPS=[
{node:'造物',rnd:1,skip:0,
 prompt:`开工前先做调研,别凭感觉。下面每一条都要查清楚、给证据,不许泛泛而谈:
1)痛点验证:“标题/开头没人点”真存在吗?给 ≥3 个公开平台(小红书/豆瓣/知乎)的真实求助实例;
2)人群定位:最被困扰的是哪类人?他们在什么场景下卡住?
3)竞品扫描:≥3 个同类工具,分别强在哪、缺在哪;
4)用户原话:给 5 条目标用户的真实吐槽原话;
5)差异化结论:这工具该做“诊断”还是“生成”?为什么?`,
 build:'检索 + 汇总调研中…',
 dims:[[1,'痛点 ≥3 个真实实例','导师'],[1,'竞品 ≥3 且说得出缺口','导师'],[1,'≥5 条用户原话','导师'],[1,'给出差异化结论','导师']],
 by:'专业导师',reason:'四条全过 → 放行,可以动手。',
 judge:`不调研直接做 = 自我感动。<b>这一步的每条都得有证据</b>,不是“我觉得有需求”。`,
 chip:'先调研,再动手',url:'research.md',view:'research'},

{node:'造物',rnd:2,skip:0,
 prompt:`你是资深内容运营 + 会用 AI 做轻量产品的工程师。严格按每一条做,缺一条都算不合格:
【目标用户】内容创作者 + 正在求职的应届生
【核心功能】只做一个:输入「标题+开头」→ 诊断 + 具体修改建议 + 改写版
【交互约束】单页网页;操作 ≤ 3 步;首屏一句话说清用途
【输出约束】每条建议含「具体改什么 + 为什么」,≤ 3 条,禁止正确废话
【技术约束】完整可运行 HTML;无后端;手机端不错位

 resume:`<div class="resume"><div class="doc"><div class="nm">张同学 · 内容运营</div><div class="sec">教育经历</div><div class="line"></div><div class="line s"></div><div class="sec">项目 / 作品</div><div class="bullet">针对内容创作者<b>标题点击率低、开头吸引力弱</b>的问题,搭建 <b>AI 标题与开头诊断工具</b>,完成 <b>10 名陌生用户测试</b>,基于反馈将 5 个分散功能<b>收敛为 1 个核心诊断流程</b>,接入数据发现 <b>62% 用户栽在情绪钩子</b>,并<b>上线可访问链接</b>,证明用户洞察、内容判断与工具化交付能力。</div><div class="sec">技能</div><div class="line"></div></div></div>`,
 interview:`<div><div style="font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:9px">挑剔面试官 · 8 个尖锐问题(节选)</div><div class="qrow"><span class="qn">Q1</span><div>你为什么砍掉其他 4 个功能?怎么判断的?</div></div><div class="qrow"><span class="qn">Q2</span><div>10 个陌生人怎么找的?哪条反馈最关键?</div></div><div class="qrow"><span class="qn">Q3</span><div>你的评分模型凭什么准?</div></div><div class="qrow"><span class="qn">Q4</span><div>那个 62% 怎么来的?样本可靠吗?</div></div><div style="font-size:11.5px;color:var(--ink-3);margin-top:9px">⚠ 最易显业余 3 处:评分逻辑说不清 / 样本太小 / 价值讲不出。</div></div>`
};
const ENDVIEW=`<div class="endcard"><div class="big">提示词谁都会写。<br>这套<em>工作流</em>,才是壁垒。</div>
  <div class="row"><div><div class="n">42</div><div class="l">轮工作流</div></div><div><div class="n">2</div><div class="l">次被真人打回</div></div><div><div class="n">30+</div><div class="l">个维度被逐一验</div></div></div>
  <div class="note">你看到的不是“一句话出作品”。是同一套循环——<b>写 Brief → AI 造 → 多维验证 → 真人判定 → 过/打回</b>——跑了 42 遍。<br><br>每条要求都被逐维验证、被<b>专业导师 / 真实用户 / 资深 HR</b> 判过,做出来的东西才有效。<br><b>提示词能抄,工作流和那些判你的人,抄不走。</b></div></div>`;

let i=-1,busy=false,rnd=0;
const log=document.getElementById('log'),pvbody=document.getElementById('pvbody'),prog=document.getElementById('prog');
function buildProg(){prog.innerHTML='';STEPS.forEach(()=>prog.appendChild(document.createElement('i')));}
document.getElementById('tot').textContent=STEPS.length;
function lightWF(s,verdict){document.querySelectorAll('.wstage').forEach(e=>{const si=+e.dataset.s;e.classList.remove('active','pass','reject','done');if(si<s)e.classList.add('done');else if(si===s){e.classList.add('active');if(s===4&&verdict)e.classList.add(verdict);}});}
function addGhost(n){const g=document.createElement('div');g.className='ghost';g.textContent='⋯ 工作流又跑了 '+n+' 轮(改字号·调措辞·修边界·兼容…)⋯';log.appendChild(g);log.scrollTop=log.scrollHeight;}
function addTurn(cls,who,av){const t=document.createElement('div');t.className='turn '+cls;t.innerHTML=`<div class="who ${cls}"><span class="av">${av}</span>${who}</div><div class="bubble"></div>`;log.appendChild(t);log.scrollTop=log.scrollHeight;return t.querySelector('.bubble');}
function typewrite(el,text,cb){let n=0;const car=document.createElement('span');car.className='caret';el.appendChild(car);const sp=Math.max(5,Math.min(16,900/text.length));
  const t=setInterval(()=>{n++;el.textContent=text.slice(0,n);el.appendChild(car);log.scrollTop=log.scrollHeight;if(n>=text.length){clearInterval(t);car.remove();cb&&cb();}},sp);}
function showView(key){pvbody.innerHTML=`<div class="pv-stage on">${key==='end'?ENDVIEW:VIEWS[key]}</div>`;}
function stamp(type){if(type==='ok')return'';return `<span class="stamp ${type}">${type==='back'?'打回':'报错'}</span>`;}
function renderVerifyShell(s){const rows=s.dims.map((d,k)=>`<li class="dim-row" data-k="${k}"><span class="dchk">·</span><span class="dtxt">${d[1]}</span><span class="dby">${d[2]}</span></li>`).join('');
  document.getElementById('verify').innerHTML=
   `<div class="vf-l"><div class="vf-h">逐维度验证 · 每条都要过</div><ul class="dims" id="dims">${rows}</ul></div>`+
   `<div class="vf-r"><div class="judge-by" style="font-size:11px;color:var(--ink-3)">判官 · <b style="color:var(--ink)">${s.by}</b></div><div class="verdict wait" id="verdict2">验证中…</div><div class="vreason" id="vreason"></div></div>`+
   `<div class="vf-foot">🧠 ${s.judge}</div>`;}
function animVerify(s,cb){const rows=[...document.querySelectorAll('#dims .dim-row')];let k=0;
  const t=setInterval(()=>{if(k>=rows.length){clearInterval(t);cb();return;}const d=s.dims[k];const r=rows[k];r.classList.add('shown',d[0]?'ok':'no');r.querySelector('.dchk').textContent=d[0]?'✓':'✗';k++;},300);}

function nextStep(){
  if(busy)return; if(i>=STEPS.length-1){endShow();return;}
  busy=true;i++;const s=STEPS[i];
  document.getElementById('cur').textContent=i+1;
  document.getElementById('nextBtn').disabled=true;
  if(s.skip){rnd+=s.skip;addGhost(s.skip);} rnd=Math.max(rnd,s.rnd);document.getElementById('rnd').textContent=s.rnd;
  lightWF(0);
  const youB=addTurn('you','你','▶');
  typewrite(youB,s.prompt,()=>{
    lightWF(1);
    const aiB=addTurn('ai','Claude Code','✦');aiB.innerHTML=`<span class="building"><span class="sp"></span>${s.build}</span>`;log.scrollTop=log.scrollHeight;
    setTimeout(()=>{
      document.getElementById('urlbar').textContent=s.url;document.getElementById('urlbar').classList.toggle('live',s.view==='live');
      showView(s.view);
      lightWF(2); renderVerifyShell(s);
      animVerify(s,()=>{
        lightWF(3);
        const fail=s.dims.some(d=>!d[0]); const verdict=fail?'reject':'pass';
        setTimeout(()=>{
          lightWF(4,verdict);
          const stype=fail?'back':(s.status==='warn'?'warn':'ok');const st=stamp(stype);if(st)pvbody.querySelector('.pv-stage').insertAdjacentHTML('beforeend',st);
          aiB.innerHTML=`<span class="${fail?'done-back':'done-ok'}">${fail?'✗ 有维度没过 → 被打回':'✓ 全维度通过'}</span>`;log.scrollTop=log.scrollHeight;
          const vd=document.getElementById('verdict2');vd.className='verdict '+verdict;vd.textContent=verdict==='pass'?'✅ 通过':'❌ 打回';
          document.getElementById('vreason').textContent=s.reason;
          prog.children[i].classList.add('done');
          document.getElementById('nextBtn').disabled=false;document.getElementById('nextBtn').textContent=(i>=STEPS.length-1)?'▶ 看总结':'▶ 下一关';
          busy=false;
        },450);
      });
    },1000);
  });
}
function endShow(){busy=true;showView('end');lightWF(5);document.querySelectorAll('.wstage').forEach(e=>e.classList.add('done'));
  document.getElementById('urlbar').textContent='工作流 · 完成';document.getElementById('rnd').textContent='42';
  document.getElementById('verify').innerHTML='<div class="vf-foot">同一套循环跑了 42 遍,每条要求都被<b>真人/真实用户</b>验过、判过。提示词能抄,<b>工作流和判你的人抄不走</b>——这就是 12 道关。</div>';
  document.getElementById('nextBtn').textContent='✓ 完成';document.getElementById('nextBtn').disabled=true;busy=false;}
function resetAll(){i=-1;busy=false;rnd=0;log.innerHTML='';buildProg();document.querySelectorAll('.wstage').forEach(e=>e.classList.remove('active','pass','reject','done'));
  document.getElementById('cur').textContent='0';document.getElementById('rnd').textContent='0';
  document.getElementById('urlbar').textContent='本地预览 · 还没动手';document.getElementById('urlbar').classList.remove('live');
  document.getElementById('verify').innerHTML='<div class="vf-foot" id="vfoot0">点「下一步」——看每个提示词里的<b>每一条要求,怎么被逐维验证、被真人判过</b>。提示词谁都会写,这套工作流才是壁垒。</div>';
  document.getElementById('nextBtn').disabled=false;document.getElementById('nextBtn').textContent='▶ 开始';
  pvbody.innerHTML=`<div class="pv-stage on" style="display:flex;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--ink-4)"><div><div style="font-family:var(--serif);font-size:16px;color:var(--ink-3);margin-bottom:8px">右边会一关一关长出一个作品</div><div style="font-size:12.5px">但重点看下面:每条要求怎么被验、被谁判 →</div></div></div>`;
}
resetAll();
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();nextStep();}});
</script>
</body>
</html>
